name: Publicar actualización Android (APK)

# main    -> versión OFICIAL (le llega a todos los usuarios)
# pruebas -> versión de PRUEBAS "MEBUC Pruebas" (app aparte, solo para probar)
on:
  push:
    branches: [ main, pruebas ]
    paths:
      - 'www/**'
      - 'android/**'
      - 'capacitor.config.json'
      - 'package.json'
      - 'icono.png'
      - 'generar-iconos.py'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Verificar llave de firma
        env:
          KS: ${{ secrets.MEBUC_KEYSTORE_BASE64 }}
          PW: ${{ secrets.MEBUC_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KS" ] || [ -z "$PW" ]; then
            echo "::error::Faltan los secretos MEBUC_KEYSTORE_BASE64 y MEBUC_KEYSTORE_PASSWORD"
            exit 1
          fi
          echo "$KS" | base64 -d > "$RUNNER_TEMP/mebuc.jks"

      - name: Definir canal (oficial o pruebas)
        run: |
          if [ "$GITHUB_REF_NAME" = "pruebas" ]; then echo "CANAL=pruebas" >> "$GITHUB_ENV"; else echo "CANAL=oficial" >> "$GITHUB_ENV"; fi

      - name: Configurar la app
        run: |
          printf 'window.MEBUC_REPO = "%s";\nwindow.MEBUC_CANAL = "%s";\n' "${{ github.repository }}" "$CANAL" > www/config-actualizacion.js

      - name: Convertir en app de pruebas
        if: env.CANAL == 'pruebas'
        run: |
          sed -i 's/applicationId "co.mebuc.pin"/applicationId "co.mebuc.pin.pruebas"/' android/app/build.gradle
          sed -i 's#<string name="app_name">MEBUC</string>#<string name="app_name">MEBUC Pruebas</string>#; s#<string name="title_activity_main">MEBUC</string>#<string name="title_activity_main">MEBUC Pruebas</string>#' android/app/src/main/res/values/strings.xml

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generar íconos desde icono.png
        run: |
          pip install pillow
          python generar-iconos.py

      - name: Instalar dependencias
        run: npm install

      - name: Copiar la web a Android
        run: npx cap sync android

      - name: Compilar APK firmada
        working-directory: android
        env:
          MEBUC_KEYSTORE: ${{ runner.temp }}/mebuc.jks
          MEBUC_KEYSTORE_PASSWORD: ${{ secrets.MEBUC_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -PversionCode=${{ github.run_number }} -PversionName=${{ github.run_number }}
          if [ "$CANAL" = "pruebas" ]; then
            cp app/build/outputs/apk/release/app-release.apk ../MEBUC-Pruebas.apk
          else
            cp app/build/outputs/apk/release/app-release.apk ../MEBUC.apk
          fi

      - name: Publicar versión OFICIAL
        if: env.CANAL == 'oficial'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: MEBUC versión ${{ github.run_number }}
          body: ${{ github.event.head_commit.message || 'Actualización de MEBUC' }}
          files: MEBUC.apk
          make_latest: true

      - name: Publicar versión de PRUEBAS
        if: env.CANAL == 'pruebas'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: pruebas-v${{ github.run_number }}
          target_commitish: pruebas
          name: MEBUC PRUEBAS versión ${{ github.run_number }}
          body: ${{ github.event.head_commit.message || 'Versión de pruebas' }}
          files: MEBUC-Pruebas.apk
          prerelease: true
          make_latest: false
